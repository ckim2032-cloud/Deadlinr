<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deadlinr | Pro Student Workspace</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="onboarding">
    <div class="onboard-card">
      <div class="onboard-logo"><i data-lucide="zap" style="color:#3b82f6"></i> Deadlinr</div>
      <input type="text" id="user-name-input" class="onboard-input" placeholder="What's your name?">
      <button class="onboard-btn" onclick="initApp()">Enter Workspace</button>
    </div>
  </div>

  <div id="app-container">
    <aside id="sidebar">
      <div class="brand"><div class="brand-logo"><i data-lucide="check" size="22" color="white"></i></div><div class="brand-name">Deadlinr</div></div>
      <button class="btn-new-task" onclick="openModal()"><i data-lucide="plus-circle" size="20"></i> New Task</button>
      <nav id="sidebar-nav">
        <div class="nav-link active" onclick="navigate('dashboard')"><i data-lucide="layout-grid" size="20"></i> Dashboard</div>
        <div class="nav-link" onclick="navigate('tasks')"><i data-lucide="layers" size="20"></i> Focus List</div>
        <div class="nav-link" onclick="navigate('timer')"><i data-lucide="timer" size="20"></i> Focus Timer</div>
        <div class="nav-link" onclick="navigate('calendar')"><i data-lucide="calendar-days" size="20"></i> Timeline</div>
        <div class="nav-link" onclick="navigate('stats')"><i data-lucide="trending-up" size="20"></i> Analytics</div>
        <div class="nav-link" onclick="navigate('settings')"><i data-lucide="sliders" size="20"></i> Settings</div>
      </nav>
    </aside>

    <main id="main-wrapper">
      <header>
        <div><h2 id="welcome-text" style="font-family: 'Oswald';">Hey!</h2><p id="date-subtitle"></p></div>
        <div class="search-container"><i data-lucide="search" size="18"></i><input type="text" placeholder="Search..." oninput="handleSearch(this.value)"></div>
      </header>
      <div id="page-dashboard" class="page active"><div class="stat-grid" id="stat-grid"></div><div id="dashboard-widgets"></div></div>
      <div id="page-tasks" class="page"><div class="content-box"><div id="all-tasks-list"></div></div></div>
      <div id="page-timer" class="page"><div class="content-box"><div id="timer-display">25:00</div></div></div>
      <div id="page-calendar" class="page"><div class="content-box"><div id="calendar-grid"></div></div></div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
