<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deadlinr Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark-theme">
  <div id="onboarding">
    <div class="onboard-card">
      <div class="onboard-logo">Deadlinr</div>
      <input type="text" id="user-name-input" class="onboard-input" placeholder="What's your name?">
      <button class="onboard-btn" onclick="initApp()">Enter Workspace</button>
    </div>
  </div>

  <div id="app-container">
    <nav id="sidebar">
      <div class="brand">
        <div class="brand-logo"><i data-lucide="check" size="22" color="white"></i></div>
        <div class="brand-name">Deadlinr</div>
      </div>
      <button class="btn-new-task" onclick="openModal()">New Task</button>
      <div id="sidebar-nav">
        <div class="nav-item active" onclick="navigate('dashboard')">Dashboard</div>
        <div class="nav-item" onclick="navigate('tasks')">Focus List</div>
        <div class="nav-item" onclick="navigate('timer')">Focus Timer</div>
      </div>
    </nav>
    <main id="main-wrapper">
      <header><h2 id="welcome-text">Hey!</h2></header>
      <div id="page-dashboard" class="page active">
        <section class="stats-grid"></section>
        <div id="dashboard-widgets"></div>
      </div>
      <div id="page-tasks" class="page">
        <section class="content-section"><div id="all-tasks-list"></div></section>
      </div>
      <div id="page-timer" class="page">
        <section class="content-section"><div id="timer-display">25:00</div></section>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
